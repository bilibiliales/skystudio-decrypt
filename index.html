                addLog(`[!] 已跳过非txt文件: ${file.name}`);
                showToast(`已跳过非txt文件：${file.name}`, 'error');
                continue;
            }

            try {
                const content = await readTextFile(file);
                const item = createProjectItem(file.name, content);
                projectFiles.push(item);
                if (!firstAddedId) {
                    firstAddedId = item.id;

                addLog(`[+] 已加载文件: ${file.name}`);
                addLog(`[*] 已识别: ${item.meta.name} / BPM ${item.meta.bpm} / ${item.meta.isEncrypted ? '加密' : '未加密'}`);
                showToast(`已识别：${item.meta.name}`, 'success');
            } catch (error) {
                addLog(`[!] 文件未被接受 ${file.name}: ${error.message}`);
                showToast(`文件未被接受：${file.name}`, 'error');
                if (!getActiveProject()) {
                    setFlowState('error', `文件未被接受：${file.name}，${error.message}`);

    // 开始预览
    function startPreview() {
        if (isPreviewing) return;
        if (notesData.length === 0) return;
        if (currentNoteIndex >= notesData.length) {
            currentNoteIndex = 0;
        }
        if (previewSleepUnits.length !== notesData.length) {
            previewSleepUnits = buildTimingModel(notesData).sleepUnits;
        }

        isPreviewing = true;
        previewButton.textContent = '暂停预览';
        stopPreviewButton.disabled = false;
        updateSpeedControl(false);

        // 创建中止控制器
        previewAbortReason = '';
        previewAbortController = new AbortController();
        const signal = previewAbortController.signal;
        const runId = ++previewRunId;

        // 使用Promise处理异步预览
        previewPromise = new Promise((resolve, reject) => {
            playNextNote(resolve, reject, signal);
        }).then(() => {
            if (runId !== previewRunId) return;
            // 预览正常结束
            resetPreviewState({ returnToTop: true, clearHighlights: true });
        }).catch(error => {
            if (runId !== previewRunId) return;
            if (error.name === 'AbortError' && previewAbortReason === 'pause') {
                previewPromise = null;
                previewAbortController = null;
                return;
            }
            if (error.name !== 'AbortError') {
                addLog(`[!] 预览出错: ${error.message}`);
            }
            resetPreviewState({ returnToTop: true, clearHighlights: true });
        });
    }

    }

    function createPreviewAbortError() {
        return new DOMException('Preview aborted', 'AbortError');
    }

    function waitForPreviewDelay(baseDelay, signal) {
        if (baseDelay <= 0) {
            return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
            if (signal.aborted) {
                reject(createPreviewAbortError());
                return;
            }

            let virtualElapsed = 0;
            let lastTime = Date.now();
            let timeoutId = null;
            let settled = false;

            const cleanup = () => {
                if (timeoutId !== null) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
                signal.removeEventListener('abort', handleAbort);
            };

            const handleAbort = () => {
                if (settled) return;
                settled = true;
                cleanup();
                reject(createPreviewAbortError());
            };

            const tick = () => {
                if (signal.aborted) {
                    handleAbort();
                    return;
                }

                const now = Date.now();
                virtualElapsed += (now - lastTime) * currentSpeed;
                lastTime = now;

                if (virtualElapsed >= baseDelay) {
                    settled = true;
                    cleanup();
                    resolve();
                    return;
                }

                timeoutId = setTimeout(tick, 16);
            };

            signal.addEventListener('abort', handleAbort, { once: true });
            timeoutId = setTimeout(tick, 16);
        });
    }

    async function playNextNote(resolve, reject, signal) {
        try {
            const firstNoteIndex = currentNoteIndex;

            for (let i = firstNoteIndex; i < notesData.length; i++) {
                // 检查是否中止
                if (signal.aborted) {
                    throw new DOMException('Preview aborted', 'AbortError');
                }

                const isNewPreviewGroup = i === firstNoteIndex || (previewSleepUnits[i - 1] || 0) > 0;
                if (isNewPreviewGroup) {
                    clearAllHighlights();
                }

                const note = notesData[i];
                const keyName = note.key;
                const keyIndex = getKeyIndex(keyName);

                if (keyIndex !== -1) {
                    // 播放音频
                    playSound(keyIndex);

                    // 高亮琴键
                    const keyElement = pianoKeys[keyIndex];
                    keyElement.classList.add('piano-key-down');
                    highlightedKeys.add(keyIndex);

                    // 高亮对应的代码行（使用映射关系）
                    const codeLineNumber = codeLineMap.get(i);
                    if (codeLineNumber !== undefined) {
                        highlightCodeLine(codeLineNumber);
                    }
                    highlightNotationEvent(i);
                    highlightPipelineColumn(i);
                    highlightSnapshotGridCell(i);
                    requestPreviewScroll(i);
                }

                currentNoteIndex = i + 1;
                const sleepUnit = previewSleepUnits[i] || 0;
                const delay = sleepUnit * (60000 / BPM);

                // 使用await实现非阻塞延迟
                await waitForPreviewDelay(delay, signal);

                // 检查是否中止
                if (signal.aborted) {
                    throw new DOMException('Preview aborted', 'AbortError');
                }
            }

            // 预览结束
            currentNoteIndex = 0;
            clearAllHighlights();
            resolve();
        } catch (error) {
            reject(error);
        }
    }

    function findGCD(a, b) {
        while (b !== 0) {
            let temp = b;
            b = a % b;
            a = temp;

    }

        const number = parseFloat(value);

    function renderKatexInline(expression, target, fallbackText = expression) {
        target.innerHTML = '';
        if (window.katex) {
            try {
                window.katex.render(expression, target, {
                    throwOnError: false,
                    displayMode: false
                });
                return;
            } catch (error) {
                console.warn('KaTeX渲染失败:', expression, error);
            }
        }
        target.textContent = fallbackText;
    }

    function getNumberedNotationExpression(keyName) {
        const keyIndex = getKeyIndex(keyName);
        return keyLabelMap.numbered[keyIndex] || '?';
    }

    function getNumberedNotationFallback(keyName) {
        const keyIndex = getKeyIndex(keyName);
        return keyLabelFallbackMap.numbered[keyIndex] || '?';
    }

    function getNumberedNotationParts(keyName) {
        const keyIndex = getKeyIndex(keyName);
        if (keyIndex < 0) {
            return { digit: '?', dots: 0 };
        }
        return {
            digit: String((keyIndex % 7) + 1),
            dots: Math.floor(keyIndex / 7)
        };
    }

    function createNotationSymbol(expression, fallbackText, className) {
        const symbol = document.createElement('span');
        symbol.className = className;
        renderKatexInline(expression, symbol, fallbackText);
        return symbol;
    }

    function buildNotationGroups(songNotes) {
        const groups = [];

        songNotes.forEach((note, noteIndex) => {
            const time = Math.round(Number(note.time) || 0);
            const lastGroup = groups[groups.length - 1];

            if (lastGroup && lastGroup.time === time) {
                lastGroup.notes.push(note);
                lastGroup.noteIndices.push(noteIndex);
                return;
            }

            groups.push({
                time,
                notes: [note],
                noteIndices: [noteIndex]
            });
        });

        return groups;
    }

    function createEmptyNotationMeasures(count) {
        return Array.from({ length: count }, () => (
            Array.from({ length: NOTATION_BEATS_PER_MEASURE }, () => [])
        ));
    }

    function buildNotationMeasures(songNotes, bpm) {
        const noteGroups = buildNotationGroups(songNotes);
        if (noteGroups.length === 0) {
            return createEmptyNotationMeasures(1);
        }

        const timingModel = buildTimingModel(songNotes);
        const beatDuration = timingModel.unit || 1;
        const measureDuration = beatDuration * NOTATION_BEATS_PER_MEASURE;
        const startTime = 0;
        const lastRelativeTime = Math.max(0, noteGroups[noteGroups.length - 1].time - startTime);
        const initialMeasureCount = Math.max(1, Math.floor((lastRelativeTime + 0.001) / measureDuration) + 1);
        const measures = createEmptyNotationMeasures(initialMeasureCount);

        noteGroups.forEach(group => {
            const relativeTime = Math.max(0, group.time - startTime);
            let measureIndex = Math.floor((relativeTime + 0.001) / measureDuration);
            let measureOffset = relativeTime - (measureIndex * measureDuration);

            if (measureOffset < 0) {
                measureOffset = 0;
            }

            let beatIndex = Math.floor((measureOffset + 0.001) / beatDuration);
            if (beatIndex >= NOTATION_BEATS_PER_MEASURE) {
                measureIndex += 1;
                beatIndex = 0;
                measureOffset = 0;
            }

            while (measureIndex >= measures.length) {
                measures.push(...createEmptyNotationMeasures(1));
            }

            const beatStart = beatIndex * beatDuration;
            const beatOffset = Math.max(0, Math.min(1, (measureOffset - beatStart) / beatDuration));
            const noteInfos = group.notes.map((note, index) => ({
                key: note.key,
                noteIndex: group.noteIndices[index]
            })).sort((left, right) => getKeyIndex(right.key) - getKeyIndex(left.key));

            measures[measureIndex][beatIndex].push({
                beatOffset,
                noteInfos,
                noteIndices: group.noteIndices
            });
        });

        measures.forEach(measure => {
            measure.forEach(beatEvents => {
                beatEvents.sort((left, right) => left.beatOffset - right.beatOffset);
            });
        });

        return measures;
    }

    function createNotationEventElement(event) {
        const eventElement = document.createElement('button');
        eventElement.type = 'button';
        eventElement.className = 'notation-event';
        if (event.noteInfos.length > 3) {
            eventElement.classList.add('dense');
        }

        const chord = document.createElement('span');
        chord.className = 'notation-chord';

        event.noteInfos.forEach(noteInfo => {
            chord.appendChild(createNotationSymbol(
                getNumberedNotationExpression(noteInfo.key),
                getNumberedNotationFallback(noteInfo.key),
                'notation-note'
            ));
        });

        eventElement.appendChild(chord);
        event.noteIndices.forEach(noteIndex => {
            notationNoteMap.set(noteIndex, eventElement);

        const firstNoteIndex = event.noteIndices[0];

    }

    function createNotationMeasureElement(measure) {
        const measureElement = document.createElement('div');
        measureElement.className = 'notation-measure';

        measure.forEach(beatEvents => {
            const beatElement = document.createElement('div');
            beatElement.className = 'notation-beat';
            if (!beatEvents || beatEvents.length === 0) {
                beatElement.appendChild(createNotationSymbol('0', '0', 'notation-rest'));
            } else {
                beatEvents.forEach(event => {
                    beatElement.appendChild(createNotationEventElement(event));
                });
            }
            measureElement.appendChild(beatElement);
        });

        return measureElement;
    }

    function buildPipelineColumns(songNotes) {
        const timingModel = buildTimingModel(songNotes);
        const unit = timingModel.unit || 1;
        const columns = [];
        let maxSlotIndex = 0;

        songNotes.forEach((note, noteIndex) => {
            const time = Math.max(0, Math.round(Number(note.time) || 0));
            const slotIndex = Math.max(0, Math.round(time / unit));
            const pitchIndex = PIPELINE_KEY_ORDER.indexOf(note.key);
            if (pitchIndex < 0) {
                return;
            }

            maxSlotIndex = Math.max(maxSlotIndex, slotIndex);
            if (!columns[slotIndex]) {
                columns[slotIndex] = [];
            }
            columns[slotIndex].push({
                note,
                noteIndex,
                pitchIndex
            });
        });

        const minimumColumnCount = NOTATION_BEATS_PER_MEASURE * NOTATION_MEASURES_PER_LINE;
        const roundedColumnCount = Math.ceil((maxSlotIndex + 1) / minimumColumnCount) * minimumColumnCount;
        const columnCount = Math.max(minimumColumnCount, roundedColumnCount);

        return Array.from({ length: columnCount }, (_, slotIndex) => columns[slotIndex] || []);
    }

            spacer.style.width = `${Math.max(0, pipelineContainer.clientWidth / 2)}px`;

    function buildSnapshotGridPages(songNotes) {
        const timingModel = buildTimingModel(songNotes);
        const unit = timingModel.unit || 1;
        let maxSlotIndex = 0;
        const slotNotes = new Map();
        snapshotGridNoteMap.clear();

        songNotes.forEach((note, noteIndex) => {
            const time = Math.max(0, Math.round(Number(note.time) || 0));
            const slotIndex = Math.max(0, Math.round(time / unit));
            const pageIndex = Math.floor(slotIndex / SNAPSHOT_GRID_CELLS_PER_PAGE);
            const cellIndex = slotIndex % SNAPSHOT_GRID_CELLS_PER_PAGE;

            maxSlotIndex = Math.max(maxSlotIndex, slotIndex);
            if (!slotNotes.has(slotIndex)) {
                slotNotes.set(slotIndex, []);
            }

            const noteInfo = {
                note,
                noteIndex,
                slotIndex,
                pageIndex,
                cellIndex
            };
            slotNotes.get(slotIndex).push(noteInfo);
            snapshotGridNoteMap.set(noteIndex, noteInfo);
        });

        const pageCount = Math.max(1, Math.ceil((maxSlotIndex + 1) / SNAPSHOT_GRID_CELLS_PER_PAGE));
        return Array.from({ length: pageCount }, (_, pageIndex) => (
            Array.from({ length: SNAPSHOT_GRID_CELLS_PER_PAGE }, (_, cellIndex) => {
                const slotIndex = (pageIndex * SNAPSHOT_GRID_CELLS_PER_PAGE) + cellIndex;
                return {
                    slotIndex,
                    pageIndex,
                    cellIndex,
                    notes: slotNotes.get(slotIndex) || []
                };
            })
        ));
    }

    function createSnapshotKeyGrid(notes) {
        const pressedKeys = new Set(notes.map(noteInfo => noteInfo.note.key));
        const keyGrid = document.createElement('div');
        keyGrid.className = 'snapshot-key-grid';

        keyOrder.forEach(keyName => {
            const keyState = document.createElement('span');
            keyState.className = [
                'snapshot-key-state',
                pressedKeys.has(keyName) ? 'on' : ''
            ].filter(Boolean).join(' ');
            keyGrid.appendChild(keyState);
        });

        return keyGrid;
    }

    function createSnapshotGridCell(cellData) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = [
            'snapshot-grid-cell',
            cellData.notes.length === 0 ? 'empty' : ''
        ].filter(Boolean).join(' ');
        cell.dataset.slotIndex = String(cellData.slotIndex);

        if (cellData.notes.length > 0) {
            cell.appendChild(createSnapshotKeyGrid(cellData.notes));
            cell.addEventListener('click', () => {
                jumpToNoteIndex(cellData.notes[0].noteIndex, `方格第 ${cellData.cellIndex + 1} 格`);
            });
        } else {
            cell.setAttribute('aria-disabled', 'true');
        }

        return cell;
    }

    function renderSnapshotGridPage(pageIndex) {
        if (!snapshotGridContainer || snapshotGridPages.length === 0) {
            return;
        }

        currentSnapshotGridPageIndex = Math.max(0, Math.min(snapshotGridPages.length - 1, pageIndex));
        snapshotGridContainer.innerHTML = '';
        snapshotGridCellElements.clear();

        const board = document.createElement('div');
        board.className = 'snapshot-grid-board';
        snapshotGridPages[currentSnapshotGridPageIndex].forEach(cellData => {
            const cell = createSnapshotGridCell(cellData);
            snapshotGridCellElements.set(cellData.cellIndex, cell);
            board.appendChild(cell);
        });

        const prevButton = document.createElement('button');
        prevButton.type = 'button';
        prevButton.className = 'snapshot-page-button prev';
        prevButton.textContent = '‹';
        prevButton.disabled = currentSnapshotGridPageIndex === 0;
        prevButton.addEventListener('click', () => {
            renderSnapshotGridPage(currentSnapshotGridPageIndex - 1);
        });

        const nextButton = document.createElement('button');
        nextButton.type = 'button';
        nextButton.className = 'snapshot-page-button next';
        nextButton.textContent = '›';
        nextButton.disabled = currentSnapshotGridPageIndex >= snapshotGridPages.length - 1;
        nextButton.addEventListener('click', () => {
            renderSnapshotGridPage(currentSnapshotGridPageIndex + 1);
        });

        const pageLabel = document.createElement('div');
        pageLabel.className = 'snapshot-page-label';
        pageLabel.textContent = `P${currentSnapshotGridPageIndex + 1}`;

        snapshotGridContainer.appendChild(board);
        snapshotGridContainer.appendChild(prevButton);
        snapshotGridContainer.appendChild(nextButton);
        snapshotGridContainer.appendChild(pageLabel);
    }

    function displayFormattedSnapshotGrid(item) {
        snapshotGridContainer.innerHTML = '';
        snapshotGridNoteMap.clear();
        snapshotGridCellElements.clear();
        snapshotGridPages = [];
        currentSnapshotGridPageIndex = 0;

        if (!item || !Array.isArray(item.notesData) || item.notesData.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'snapshot-grid-empty';
            empty.textContent = '暂无可显示的方格谱';
            snapshotGridContainer.appendChild(empty);
            return;
        }

        snapshotGridPages = buildSnapshotGridPages(item.notesData);
        renderSnapshotGridPage(0);
    }

    function displayFormattedCode(code) {
        // 清空代码容器
        codeContainer.innerHTML = '';

        // 按行分割代码
        const lines = code.split('\n');

        // 创建代码行元素
        lines.forEach((line, index) => {
            const lineElement = document.createElement('div');
            lineElement.className = 'code-line';
            lineElement.id = `code-line-${index}`;
            lineElement.textContent = line;

            // 添加点击事件（跳转预览）
            lineElement.addEventListener('click', function() {
                handleCodeLineClick(index);
            });

            codeContainer.appendChild(lineElement);
        });
    }

    // 处理代码行点击事件
    function handleCodeLineClick(lineIndex) {
        if (lineIndex < CONFIG_CODE_LINE_COUNT) {
            return;
        }

        const noteIndex = lineToNoteMap.get(lineIndex);
        if (jumpToNoteIndex(noteIndex, `第 ${lineIndex} 行`)) {
            return;
        }

        if (lineIndex >= CONFIG_CODE_LINE_COUNT) {
            addLog(`[!] 无法跳转到第 ${lineIndex} 行，没有对应的音符数据`);
        }
    }

    function handleNotationEventClick(noteIndex) {
        if (!jumpToNoteIndex(noteIndex, '简谱位置')) {
            addLog(`[!] 无法跳转到简谱位置，没有对应的音符数据`);
        }
    }

    function jumpToNoteIndex(noteIndex, sourceLabel) {
        if (noteIndex === undefined || noteIndex < 0 || noteIndex >= notesData.length) {
            return false;
        }

        if (previewAbortController) {
            previewAbortReason = 'jump';
            previewAbortController.abort();
        }

        previewRunId++;
        isPreviewing = false;
        previewButton.textContent = '开始预览';
        stopPreviewButton.disabled = true;
        speedSelector.disabled = false;
        previewPromise = null;
        previewAbortController = null;
        previewAbortReason = '';
        clearAllHighlights();

        currentNoteIndex = noteIndex;
        highlightPreviewPosition(noteIndex);
        requestPreviewScroll(noteIndex);
        startPreview();

        addLog(`[*] 已跳转到${sourceLabel}，对应音符索引: ${noteIndex}`);
        return true;
    }

    function highlightCodeLine(lineIndex) {
        const lineElement = document.getElementById(`code-line-${lineIndex}`);
        if (lineElement) {
            lineElement.classList.add('highlight');
            highlightedLines.add(lineIndex);
            if (currentPreviewDisplayMode === 'code') {
                scrollCodeLineIntoPreview(lineIndex);
            }
        }
    }

    function removeCodeHighlight(lineIndex) {
        const lineElement = document.getElementById(`code-line-${lineIndex}`);
        if (lineElement) {
            lineElement.classList.remove('highlight');
            highlightedLines.delete(lineIndex);
        }
    }

    function highlightNotationEvent(noteIndex) {
        const eventElement = notationNoteMap.get(noteIndex);
        if (eventElement) {
            eventElement.classList.add('highlight');
            highlightedNotationEvents.add(eventElement);
            if (currentPreviewDisplayMode === 'notation') {
                requestPreviewScroll(noteIndex);
            }
        }
    }

    function highlightPipelineColumn(noteIndex) {
        const pipelineTarget = pipelineNoteMap.get(noteIndex);
        if (!pipelineTarget) {
            return;
        }

        if (pipelineTarget.column) {
            pipelineTarget.column.classList.add('active');
            highlightedPipelineElements.add(pipelineTarget.column);
        }
        if (pipelineTarget.note) {
            pipelineTarget.note.classList.add('active');
            highlightedPipelineElements.add(pipelineTarget.note);
        }
        if (currentPreviewDisplayMode === 'pipeline') {
            requestPreviewScroll(noteIndex);
        }
    }

    function highlightSnapshotGridCell(noteIndex) {
        const noteInfo = snapshotGridNoteMap.get(noteIndex);
        if (!noteInfo || snapshotGridPages.length === 0 || currentPreviewDisplayMode !== 'snapshot') {
            return;
        }

        if (noteInfo.pageIndex !== currentSnapshotGridPageIndex) {
            renderSnapshotGridPage(noteInfo.pageIndex);
        }

        const cell = snapshotGridCellElements.get(noteInfo.cellIndex);
        if (cell) {
            cell.classList.add('active');
            highlightedSnapshotGridCells.add(cell);
        }
    }

    function removeSnapshotGridHighlight(cell) {
        if (cell) {
            cell.classList.remove('active');
            highlightedSnapshotGridCells.delete(cell);
        }
    }

    function removePipelineHighlight(element) {
        if (element) {
            element.classList.remove('active');
            highlightedPipelineElements.delete(element);
        }
    }

    function removeNotationHighlight(eventElement) {
        if (eventElement) {
            eventElement.classList.remove('highlight');
            highlightedNotationEvents.delete(eventElement);
        }
    }

    function highlightPreviewPosition(noteIndex) {
        const codeLineNumber = codeLineMap.get(noteIndex);
        if (codeLineNumber !== undefined) {
            highlightCodeLine(codeLineNumber);
        }
        highlightNotationEvent(noteIndex);
        highlightPipelineColumn(noteIndex);
        highlightSnapshotGridCell(noteIndex);
    }

    function getVisiblePreviewContainer() {
        if (currentPreviewDisplayMode === 'code') {
            return codeContainer;
        }
        if (currentPreviewDisplayMode === 'notation') {
            return notationContainer;
        }
        if (currentPreviewDisplayMode === 'pipeline') {
            return pipelineContainer;
        }
        if (currentPreviewDisplayMode === 'snapshot') {
            return snapshotGridContainer;
        }
        return null;
    }

    function isPreviewContainerVisible(container) {
        if (!container || container.clientHeight <= 0 || container.clientWidth <= 0) {
            return false;
        }

        const style = window.getComputedStyle ? window.getComputedStyle(container) : null;
        return !style || (style.display !== 'none' && style.visibility !== 'hidden');
    }

    function clampScrollValue(value, maxValue) {
        return Math.max(0, Math.min(Math.max(0, maxValue), value));
    }

    function setPreviewScrollPosition(container, top, left = container ? container.scrollLeft : 0, behavior = 'smooth') {
        if (!container) {
            return;
        }

        const targetTop = clampScrollValue(top, container.scrollHeight - container.clientHeight);
        const targetLeft = clampScrollValue(left, container.scrollWidth - container.clientWidth);

        if (typeof container.scrollTo === 'function') {
            try {
                container.scrollTo({
                    top: targetTop,
                    left: targetLeft,
                    behavior
                });
                return;
            } catch (error) {
                container.scrollTo(targetLeft, targetTop);
                return;
            }
        }

        container.scrollTop = targetTop;
        container.scrollLeft = targetLeft;
    }

    function scrollElementIntoPreview(element, container) {
        if (!element || !container || !container.contains(element) || !isPreviewContainerVisible(container)) {
            return false;
        }

        const containerRect = container.getBoundingClientRect();
        const elementRect = element.getBoundingClientRect();
        if (containerRect.height === 0 || elementRect.height === 0) {
            return false;
        }

        const targetScrollTop = container.scrollTop
            + (elementRect.top - containerRect.top)
            - (container.clientHeight / 2)
            + (elementRect.height / 2);
        const targetScrollLeft = container.scrollLeft
            + (elementRect.left - containerRect.left)
            - (container.clientWidth / 2)
            + (elementRect.width / 2);

        setPreviewScrollPosition(container, targetScrollTop, targetScrollLeft);

        const couldScrollVertically = container.scrollHeight > container.clientHeight;
        const targetTop = clampScrollValue(targetScrollTop, container.scrollHeight - container.clientHeight);
        if (couldScrollVertically && Math.abs(container.scrollTop - targetTop) > 2 && typeof element.scrollIntoView === 'function') {
            element.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
        }

        return true;
    }

    function cancelPreviewScrollRequest() {
        if (previewScrollFrame !== null) {
            if (window.cancelAnimationFrame) {
                window.cancelAnimationFrame(previewScrollFrame);
            } else {
                clearTimeout(previewScrollFrame);
            }
            previewScrollFrame = null;
        }
        pendingPreviewScrollNoteIndex = -1;
    }

    function requestPreviewScroll(noteIndex) {
        if (noteIndex < 0 || noteIndex >= notesData.length || currentPreviewDisplayMode === 'hidden') {
            return;
        }

        pendingPreviewScrollNoteIndex = noteIndex;
        if (previewScrollFrame !== null) {
            return;
        }

        const schedule = window.requestAnimationFrame || function(callback) {
            return setTimeout(callback, 0);
        };

        previewScrollFrame = schedule(function() {
            const targetNoteIndex = pendingPreviewScrollNoteIndex;
            previewScrollFrame = null;
            pendingPreviewScrollNoteIndex = -1;
            scrollPreviewToNote(targetNoteIndex);
        });
    }

    function scrollPreviewToTop() {
        cancelPreviewScrollRequest();
        [scorePreview, codeContainer, notationContainer, pipelineContainer].forEach(container => {
            setPreviewScrollPosition(container, 0, 0);
        });
        if (snapshotGridPages.length > 0) {
            renderSnapshotGridPage(0);
        }

        const resetAgain = function() {
            [scorePreview, codeContainer, notationContainer, pipelineContainer].forEach(container => {
                setPreviewScrollPosition(container, 0, 0);
            });
        };

        if (window.requestAnimationFrame) {
            window.requestAnimationFrame(resetAgain);
        } else {
            setTimeout(resetAgain, 0);
        }
    }

    function scrollCodeLineIntoPreview(lineIndex) {
        scrollElementIntoPreview(document.getElementById(`code-line-${lineIndex}`), codeContainer);
    }

    function scrollPipelineNoteIntoPreview(noteIndex) {
        const pipelineTarget = pipelineNoteMap.get(noteIndex);
        if (!pipelineTarget || !pipelineTarget.column || !pipelineContainer) {
            return;
        }

        updatePipelineLayoutMetrics();
        scrollElementIntoPreview(pipelineTarget.column, pipelineContainer);
    }

    function getCursorNoteIndex() {
        if (notesData.length === 0) {
            return -1;
        }
        if (currentNoteIndex <= 0) {
            return 0;
        }
        return Math.min(notesData.length - 1, currentNoteIndex - 1);
    }

    function scrollPreviewToNote(noteIndex) {
        if (noteIndex < 0 || noteIndex >= notesData.length) {
            return;
        }

        if (currentPreviewDisplayMode === 'code') {
            const codeLineNumber = codeLineMap.get(noteIndex);
            if (codeLineNumber !== undefined) {
                scrollElementIntoPreview(document.getElementById(`code-line-${codeLineNumber}`), codeContainer);
            }
        } else if (currentPreviewDisplayMode === 'notation') {
            scrollElementIntoPreview(notationNoteMap.get(noteIndex), notationContainer);
        } else if (currentPreviewDisplayMode === 'pipeline') {
            scrollPipelineNoteIntoPreview(noteIndex);
        } else if (currentPreviewDisplayMode === 'snapshot') {
            highlightSnapshotGridCell(noteIndex);
        }
    }

    function clearAllHighlights() {
        // 清除所有代码高亮
        highlightedLines.forEach(lineIndex => {
            removeCodeHighlight(lineIndex);
        });
        highlightedLines.clear();

        // 清除所有简谱高亮
        highlightedNotationEvents.forEach(eventElement => {
            removeNotationHighlight(eventElement);
        });
        highlightedNotationEvents.clear();

        // 清除所有流水线高亮
        highlightedPipelineElements.forEach(element => {
            removePipelineHighlight(element);
        });
        highlightedPipelineElements.clear();

        // 清除所有方格谱高亮
        highlightedSnapshotGridCells.forEach(cell => {
            removeSnapshotGridHighlight(cell);
        });
        highlightedSnapshotGridCells.clear();

        // 清除所有琴键高亮
        highlightedKeys.forEach(keyIndex => {
            const keyElement = pianoKeys[keyIndex];
            if (keyElement) {
                keyElement.classList.remove('piano-key-down');
            }
        });
        highlightedKeys.clear();
    }

    // 为AbortController提供polyfill（针对不支持的浏览器）
    if (!window.AbortController) {
        window.AbortController = class AbortController {
            constructor() {
                this.signal = new AbortSignal();
            }
            abort() {
                this.signal.aborted = true;
                this.signal.dispatchEvent(new Event('abort'));
            }
        };

        window.AbortSignal = class AbortSignal extends EventTarget {
            constructor() {
                super();
                this.aborted = false;
            }
        };
    }
</script>
</body>
</html>
